[package]
name = "photeryx"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "z"

[dependencies]
wasm-bindgen = { version = "0.2" }
image = "0.25"
anyhow = "1"
wasm-bindgen-futures = "0.4.55"
dashmap = "6.1"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
imageproc = "0.25.0"
wee_alloc = "0.4.5"
img_hash = "3.2.0"
